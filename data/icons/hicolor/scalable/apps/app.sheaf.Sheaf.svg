<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Sheaf</title>
  <defs>
    <linearGradient id="back" x1="20" y1="16" x2="100" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7a21f"/>
      <stop offset="1" stop-color="#a56b0c"/>
    </linearGradient>
    <linearGradient id="mid" x1="24" y1="14" x2="104" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6d45a"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
    <linearGradient id="front" x1="30" y1="12" x2="108" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6d2"/>
      <stop offset="1" stop-color="#efc94a"/>
    </linearGradient>
    <linearGradient id="band" x1="28" y1="52" x2="56" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8d4a14"/>
      <stop offset="1" stop-color="#5c2e0b"/>
    </linearGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="66" cy="112" rx="34" ry="6" fill="#3d2a08" opacity="0.18"/>
  <!-- back page, fanned left -->
  <g transform="rotate(-16 62 68)">
    <rect x="30" y="22" width="58" height="80" rx="8" fill="#7a5310" opacity="0.28"/>
    <rect x="28" y="20" width="58" height="80" rx="8" fill="url(#back)"/>
  </g>
  <!-- middle page, slight opposite fan -->
  <g transform="rotate(8 66 68)">
    <rect x="38" y="20" width="58" height="80" rx="8" fill="#8a6012" opacity="0.22"/>
    <rect x="36" y="18" width="58" height="80" rx="8" fill="url(#mid)"/>
  </g>
  <!-- front page -->
  <rect x="40" y="20" width="58" height="80" rx="8" fill="#8a6012" opacity="0.16"/>
  <rect x="38" y="18" width="58" height="80" rx="8" fill="url(#front)" stroke="#c9a227" stroke-width="1.4"/>
  <!-- folded corner -->
  <path d="M84 18h12c0 8-4 12-12 12V18z" fill="#e8c547"/>
  <path d="M84 18l12 12" fill="none" stroke="#c9a227" stroke-width="1"/>
  <!-- sheaf binding band -->
  <path d="M34 54c20-8 46-8 64 1 3.2 1.6 3.2 6.4 0 8-19 8-45 9-64 1-3.4-1.5-3.4-6.7 0-8.2z" fill="url(#band)"/>
  <path d="M38 56.4c18-6.4 42-6.2 56 0.8" fill="none" stroke="#d4923a" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
</svg>
